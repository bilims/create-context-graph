inherits: _base

domain:
  id: mnd-erp
  name: MND ERP
  description: "MND üretim ERP sistemi — iş emirleri, makineler, reçeteler, fire kayıtları, bakım ve müşteri ciro analizi"
  tagline: "Üretim verisini grafiğe dökün"
  emoji: "🏭"

entity_types:
  - label: IsEmri
    pole_type: EVENT
    subtype: PRODUCTION_ORDER
    color: "#d97706"
    icon: clipboard-list
    properties:
      - name: isemrino
        type: string
        required: true
        unique: true
      - name: isemrino_raw
        type: string
      - name: name
        type: string
      - name: stokkodu
        type: string
      - name: urun_adi
        type: string
      - name: miktar
        type: float
      - name: tarih
        type: datetime
      - name: teslimtarihi
        type: datetime
      - name: kapali
        type: boolean
      - name: islemdurum
        type: integer
      - name: durum_adi
        type: string
        enum:
          - Bekliyor
          - Calisiyor
          - Atlandi
          - Ariza
          - Durus
          - Kapatildi
          - Iptal
      - name: recete_inckeyno
        type: string
      - name: refisemrino
        type: string
      - name: sonrakiisemrino
        type: string
      - name: ust_is_emri
        type: boolean
      - name: db_yil
        type: string

  - label: Urun
    pole_type: OBJECT
    subtype: PRODUCT
    color: "#0ea5e9"
    icon: box
    properties:
      - name: stok_kodu
        type: string
        required: true
        unique: true
      - name: stok_adi
        type: string
        required: true
      - name: name
        type: string
      - name: grup_kodu
        type: string
      - name: birim_kodu
        type: string

  - label: Makine
    pole_type: OBJECT
    subtype: EQUIPMENT
    color: "#475569"
    icon: cog
    properties:
      - name: makine_kodu
        type: string
        required: true
        unique: true
      - name: aciklama
        type: string
        required: true
      - name: name
        type: string
      - name: inckeyno
        type: integer
      - name: istasyon_kodu
        type: string

  - label: Istasyon
    pole_type: LOCATION
    subtype: PRODUCTION_STATION
    color: "#0891b2"
    icon: layout-grid
    properties:
      - name: istkodu
        type: string
        required: true
        unique: true
      - name: istisim
        type: string
        required: true
      - name: name
        type: string
      - name: makine_sayisi
        type: integer

  - label: Recete
    pole_type: OBJECT
    subtype: RECIPE
    color: "#059669"
    icon: list-tree
    properties:
      - name: recete_inckeyno
        type: string
        required: true
        unique: true
      - name: mamul_kodu
        type: string
      - name: mamul_adi
        type: string
      - name: name
        type: string
      - name: operasyon_sayisi
        type: integer
      - name: makine_sayisi
        type: integer

  - label: Operasyon
    pole_type: EVENT
    subtype: OPERATION_STEP
    color: "#6366f1"
    icon: activity
    properties:
